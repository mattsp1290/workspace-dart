name: CI
on:
  pull_request:
  push:
jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: git diff --check
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test packages/workspace
  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
        working-directory: packages/workspace_flutter
      - run: flutter analyze
        working-directory: packages/workspace_flutter
      - run: flutter test
        working-directory: packages/workspace_flutter
      - run: flutter pub get
        working-directory: packages/workspace_flutter/example
      - run: flutter analyze
        working-directory: packages/workspace_flutter/example
      - run: flutter test
        working-directory: packages/workspace_flutter/example
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            flutter test integration_test/native_conformance_test.dart --flavor nativeTest -d emulator-5554
            cd android
            ./gradlew :workspace_flutter:connectedDebugAndroidTest
          working-directory: packages/workspace_flutter/example
      - run: ./gradlew :workspace_flutter:testDebugUnitTest
        working-directory: packages/workspace_flutter/example/android
      - run: flutter build apk --debug --flavor production
        working-directory: packages/workspace_flutter/example
      - run: "! unzip -p build/app/outputs/flutter-apk/app-production-debug.apk 'classes*.dex' | strings | grep -E -i 'native.?test|fake.?provider|fixture'"
        working-directory: packages/workspace_flutter/example
  flutter-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: packages/workspace_flutter/example
      - run: swift test
        working-directory: packages/workspace_flutter/ios
      - name: Build and launch the iOS 18.2 compatibility host
        working-directory: packages/workspace_flutter/ios/CompatibilityHost
        run: |
          pod install
          simulator_id="$(xcrun simctl list devices 'iOS 18.2' -j | jq -r '.devices[][] | select(.name == "iPhone 16 Pro" and .isAvailable == true) | .udid' | head -n1)"
          test -n "$simulator_id"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild -workspace CompatibilityHost.xcworkspace -scheme CompatibilityHost \
            -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$simulator_id" \
            build/Build/Products/Debug-iphonesimulator/CompatibilityHost.app
          xcrun simctl launch "$simulator_id" \
            com.mattsp1290.workspaceflutter.compatibilityhost --terminate-running
      - name: Run registered-plugin conformance on the iOS simulator
        working-directory: packages/workspace_flutter/example
        run: |
          simulator_id="$(xcrun simctl list devices 'iOS 18.2' -j | jq -r '.devices[][] | select(.name == "iPhone 16 Pro" and .isAvailable == true) | .udid' | head -n1)"
          test -n "$simulator_id"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          flutter test integration_test/native_conformance_test.dart -d "$simulator_id"
      - name: Run iOS native-test fixture conformance on the iOS simulator
        working-directory: packages/workspace_flutter/example
        run: |
          simulator_id="$(xcrun simctl list devices 'iOS 18.2' -j | jq -r '.devices[][] | select(.name == "iPhone 16 Pro" and .isAvailable == true) | .udid' | head -n1)"
          test -n "$simulator_id"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          flutter test integration_test/native_conformance_test.dart \
            --flavor nativeTest --dart-define=WORKSPACE_NATIVE_TEST_FIXTURE=true \
            -d "$simulator_id"
      - name: Run the linked production-plugin XCTest host
        working-directory: packages/workspace_flutter/example/ios
        run: |
          simulator_id="$(xcrun simctl list devices 'iOS 18.2' -j | jq -r '.devices[][] | select(.name == "iPhone 16 Pro" and .isAvailable == true) | .udid' | head -n1)"
          test -n "$simulator_id"
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$simulator_id" test
      - run: flutter build ios --no-codesign
        working-directory: packages/workspace_flutter/example
      - run: "! strings build/ios/iphoneos/Runner.app/Runner | grep -E -i 'native.?test|fake.?provider|fixture'"
        working-directory: packages/workspace_flutter/example
