org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47.1's Gradle plugin still casts AGP 9.1's ApplicationExtension to
# the removed legacy type when this is enabled. Keep this compatibility switch
# until Flutter supports AGP 9's new DSL; Built-in Kotlin remains enabled.
android.newDsl=false
# Explicitly opt into AGP 9's Built-in Kotlin. Flutter's dependency validator
# currently mistakes AGP 9.1's bundled 2.2.10 runtime for a legacy project KGP.
android.builtInKotlin=true
