group 'com.mattsp1290.workspace_flutter'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'

android { namespace 'com.mattsp1290.workspace_flutter'; compileSdk 35
    defaultConfig {
        // API 29 is the first release with the framework descendant proof we
        // require before a stored document lineage may be opened.
        minSdk 29
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Flutter 3.44+ supplies Kotlin as a Built-in Kotlin plugin.  Keeping the
// bytecode target explicit preserves the previous library ABI without
// resolving or applying an external Kotlin Gradle Plugin.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
